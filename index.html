<meta charset="utf-8">
<title>하우스헌팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── 밝고 둥근 “볕 드는 집” 팔레트 ───────────── */
:root{
  --bg:#FFFAF0; --surface:#FFFFFF; --surface-2:#FFF7EC; --surface-3:#FFEBDD;
  --ink:#2A2620; --ink-2:#58514A; --muted:#948A7C;
  --line:#F2E6D6; --line-2:#E4D3BB;
  --sun:#F2643A; --sun-2:#FF7A52; --sun-ink:#FFFFFF; --sun-soft:#FFEBDD;
  --mint:#B4E5CC; --leaf:#87CC5A; --amber:#FFA843;
  --accent:#2E7D5B; --accent-2:#3D9C71; --accent-soft:#E2F1E8; --accent-ink:#1D5A3F;
  --good:#2E7D5B; --good-soft:#E2F1E8;
  --bad:#B33A24; --bad-soft:#FBE0D9;
  --warn:#B07A17; --warn-soft:#FBEED4;
  --info:#3E7FA8; --info-soft:#E3EFF7;
  --shadow-1:0 1px 2px rgba(92,70,32,.06);
  --shadow-2:0 2px 6px rgba(92,70,32,.07), 0 18px 38px -20px rgba(92,70,32,.34);
  --f-display:'Jua','Apple SD Gothic Neo',sans-serif;
  --f-sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px; --r-s:11px; --r-xs:8px;
  /* 일러스트 채색 — 스티커처럼 테마와 상관없이 같은 색을 쓴다 */
  --il-line:#1F1B16; --il-wall:#F2EDE2; --il-tan:#E2D3B5; --il-leaf:#87CC5A; --il-leaf-2:#52A436; --il-leaf-3:#3E8A2A;
  --il-mint:#B4E5CC; --il-sky:#5BAFC1; --il-sky-2:#D4E5FF; --il-blue:#267DD3; --il-pink:#FFE9E9; --il-skin:#FFE3D6;
  --il-yellow:#FFED83; --il-amber:#FFA843; --il-coral:#EA7870; --il-coral-2:#D95F58; --il-grey:#878584; --il-white:#FFFFFF;
  --il-snow:#F6F9FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1814; --surface:#252019; --surface-2:#2C261E; --surface-3:#3A2E24;
    --ink:#F5EEE3; --ink-2:#C8BDAE; --muted:#9C9080;
    --line:#3A3027; --line-2:#4E4237;
    --sun:#F2643A; --sun-2:#FF7A52; --sun-ink:#FFFFFF; --sun-soft:#3E271D;
    --mint:#6FBF9C; --leaf:#8FCB63; --amber:#FFB55C;
    --accent:#5FC095; --accent-2:#7FD4AE; --accent-soft:#1D3529; --accent-ink:#A3E3C6;
    --good:#5FC095; --good-soft:#1D3529;
    --bad:#E2846A; --bad-soft:#3A211A;
    --warn:#E0AE55; --warn-soft:#332714;
    --info:#7CB4D8; --info-soft:#1A2935;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 20px 42px -22px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
    --bg:#1C1814; --surface:#252019; --surface-2:#2C261E; --surface-3:#3A2E24;
  --ink:#F5EEE3; --ink-2:#C8BDAE; --muted:#9C9080;
  --line:#3A3027; --line-2:#4E4237;
  --sun:#F2643A; --sun-2:#FF7A52; --sun-ink:#FFFFFF; --sun-soft:#3E271D;
  --mint:#6FBF9C; --leaf:#8FCB63; --amber:#FFB55C;
  --accent:#5FC095; --accent-2:#7FD4AE; --accent-soft:#1D3529; --accent-ink:#A3E3C6;
  --good:#5FC095; --good-soft:#1D3529;
  --bad:#E2846A; --bad-soft:#3A211A;
  --warn:#E0AE55; --warn-soft:#332714;
  --info:#7CB4D8; --info-soft:#1A2935;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 20px 42px -22px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
/* 화면 높이에 맞춰 머리말·본문·마을을 세로로 쌓고, 본문만 안에서 스크롤한다.
   표든 카드든 마을 그림이 늘 화면 아래 같은 자리에 온다 */
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.wrap{max-width:1440px;margin:0 auto;padding:0 18px 48px}

/* ── 머리말 ─────────────────────────────── */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.mark{width:38px;height:38px;border-radius:13px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;flex:none;box-shadow:0 2px 0 color-mix(in srgb,var(--sun) 70%,#000)}
.mark svg{width:21px;height:21px;display:block}
h1{font-family:var(--f-display);font-size:21px;font-weight:400;margin:0;letter-spacing:.01em;line-height:1.15}
.brand p{margin:0;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.views{display:flex;gap:3px;background:var(--surface-3);padding:4px;border-radius:14px}
.views button{border:0;background:transparent;padding:6px 15px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:background .15s}
.views button:hover{color:var(--ink)}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);font-weight:600}
.tools{display:flex;align-items:center;gap:10px}
.storage{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.dot.on{background:var(--good)}
.btn{border:1.5px solid var(--line-2);background:var(--surface);padding:7px 15px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:transform .12s, border-color .15s, color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:600;box-shadow:0 2px 0 color-mix(in srgb,var(--sun) 70%,#000)}
.btn.primary:hover{background:var(--sun-2);border-color:var(--sun-2);color:var(--sun-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px;box-shadow:none}
.btn.ghost:hover{color:var(--accent);background:var(--surface-3);transform:none}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* ── 요약 줄 ────────────────────────────── */
.strip{display:flex;gap:0;flex-wrap:wrap;margin:18px 0;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-1)}
.stat{flex:1 1 150px;padding:13px 18px;border-right:1.5px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .k{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-mono);font-size:19px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.stat .v small{font-family:var(--f-sans);font-size:12px;color:var(--muted);font-weight:400}
.stat .v.name{font-family:var(--f-display);font-size:17px;font-weight:400}

/* ── 안내 띠 ────────────────────────────── */
.notice{display:flex;align-items:center;gap:10px;padding:11px 16px;border:1.5px dashed var(--line-2);border-radius:var(--r);background:var(--sun-soft);font-size:13px;color:var(--ink-2);margin-bottom:14px;flex-wrap:wrap}
.notice b{font-weight:600;color:var(--ink)}
.notice .btn{margin-left:auto}

/* ── 도구 줄 ────────────────────────────── */
.bar{display:flex;align-items:center;gap:11px;margin-bottom:13px;flex-wrap:wrap}
.seg{display:flex;border:1.5px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 15px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);font-weight:600}
.bar .hint{font-size:12.5px;color:var(--muted)}
.bar .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ── 표 ─────────────────────────────────── */
.tablewrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-1)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1000px;font-size:13.5px}
table.grid th{position:sticky;top:0;z-index:2;background:var(--surface-3);border-bottom:1.5px solid var(--line-2);padding:10px 10px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);white-space:nowrap;user-select:none}
table.grid th.sortable{cursor:pointer}
table.grid th.sortable:hover{color:var(--accent)}
table.grid th .ar{color:var(--accent);margin-left:3px}
table.grid td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid tbody tr:hover td{background:var(--surface-2)}
table.grid tr.dropped td{opacity:.45}
table.grid tr.picked td{background:var(--sun-soft)}
.c-main{position:sticky;left:0;z-index:1;background:var(--surface);border-right:1.5px solid var(--line);min-width:224px;max-width:272px}
table.grid th.c-main{z-index:3;background:var(--surface-3)}
tbody tr:hover .c-main{background:var(--surface-2)}
tr.picked .c-main{background:var(--sun-soft)}
.mainCell{display:flex;align-items:center;gap:9px}
/* 순위는 작은 집 모양으로 */
.rankno{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--ink-2);flex:none;
  width:24px;height:24px;display:grid;place-items:center;padding-top:4px;background:var(--surface-3);
  clip-path:polygon(50% 0%,100% 40%,100% 100%,0% 100%,0% 40%)}
.rankno.top{background:var(--sun);color:var(--sun-ink)}
.movebtns{display:flex;flex-direction:column;gap:2px;flex:none}
.movebtns button{border:1.5px solid var(--line-2);background:var(--surface);width:21px;height:15px;line-height:1;padding:0;font-size:8px;cursor:pointer;color:var(--ink-2);border-radius:5px}
.movebtns button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.movebtns button:disabled{opacity:.3;cursor:default}
.namebox{min-width:0}
.namebox .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.namebox .nm:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.namebox .ad{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
td.num{text-align:right}
th.num{text-align:right}
.sub{font-size:11px;color:var(--muted)}

.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.s-interest{background:var(--surface-3);color:var(--ink-2)}
.pill.s-planned{background:var(--info-soft);color:var(--info)}
.pill.s-visited{background:var(--accent-soft);color:var(--accent-ink)}
.pill.s-shortlist{background:var(--sun);color:var(--sun-ink)}
.pill.s-dropped{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;padding:2px 9px;border:1.5px solid var(--line-2);border-radius:999px;font-size:11.5px;color:var(--ink-2)}
.tag.sale{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.tag.jeonse{border-color:var(--info);color:var(--info);background:var(--info-soft)}

.score{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.score .n{font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.meter{width:44px;height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--accent);border-radius:999px}
.pick{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex:none}

/* ── 카드 ───────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(325px,1fr));gap:15px}
.card{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-1);display:flex;flex-direction:column;overflow:hidden;transition:transform .15s, box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.card.dropped{opacity:.55}
.card-hd{padding:14px 16px 12px;border-bottom:1.5px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.card-hd .t{font-family:var(--f-display);font-size:18px;font-weight:400;line-height:1.25;margin:0 0 3px;cursor:pointer}
.card-hd .t:hover{color:var(--accent)}
.card-hd .meta{font-size:11.5px;color:var(--muted)}
.card-key{display:grid;grid-template-columns:1.3fr 1fr .85fr;border-bottom:1.5px solid var(--line);background:var(--surface-2)}
.card-key div{padding:10px 14px;border-right:1.5px solid var(--line);min-width:0}
.card-key div:last-child{border-right:0}
.card-key .k{font-size:10px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.card-key .v{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body{padding:13px 16px;display:flex;flex-direction:column;gap:11px;flex:1}
.kv{display:flex;flex-wrap:wrap;gap:6px 15px;font-size:12.5px;color:var(--ink-2)}
.kv span b{color:var(--muted);font-weight:500;margin-right:4px}
.pc{font-size:13px;line-height:1.55;display:flex;gap:9px}
.pc .lb{flex:none;width:19px;height:19px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:2px}
.pc.good .lb{background:var(--good-soft);color:var(--good)}
.pc.bad .lb{background:var(--bad-soft);color:var(--bad)}
.shots{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.shots img{width:78px;height:58px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);flex:none;cursor:zoom-in}
.card-ft{padding:10px 16px;border-top:1.5px solid var(--line);display:flex;align-items:center;gap:9px;background:var(--surface-2)}
.card-ft .score{margin-left:auto}

/* ── 나란히 비교 ────────────────────────── */
.cmpwrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-1)}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
table.cmp th,table.cmp td{padding:10px 15px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp thead th{position:sticky;top:0;background:var(--surface-3);border-bottom:1.5px solid var(--line-2);z-index:2}
table.cmp thead th.lbl{z-index:3}
table.cmp .lbl{position:sticky;left:0;background:var(--surface);border-right:1.5px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;width:132px;z-index:1}
table.cmp thead .lbl{background:var(--surface-3)}
table.cmp tbody tr:hover td{background:var(--surface-2)}
table.cmp tbody tr:hover .lbl{background:var(--surface-2)}
table.cmp .hd{font-family:var(--f-display);font-size:16px;font-weight:400}
table.cmp .best{background:var(--good-soft) !important;color:var(--good);font-weight:600}
table.cmp .worst{background:var(--bad-soft) !important;color:var(--bad)}
table.cmp tr.sect td{background:var(--surface-3);font-size:10.5px;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:7px 15px}
table.cmp .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.cmp .long{white-space:pre-wrap;font-size:12.5px;line-height:1.55;min-width:180px}

/* ── 설정 ───────────────────────────────── */
.panel{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px 22px;margin-bottom:15px;box-shadow:var(--shadow-1)}
.panel h2{font-family:var(--f-display);font-size:18px;font-weight:400;margin:0 0 5px}
.panel .desc{font-size:12.5px;color:var(--muted);margin:0 0 15px;max-width:62ch;line-height:1.6}
.rateRow{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rateRow:last-of-type{border-bottom:0}
.rateRow input[type=text]{flex:1;min-width:110px}
.wsel{display:flex;gap:4px}
.wsel button{border:1.5px solid var(--line-2);background:var(--surface);width:28px;height:28px;border-radius:999px;font-size:12px;cursor:pointer;font-family:var(--f-mono)}
.wsel button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=tel],select,textarea{
  border:1.5px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:8px 12px;font-size:13.5px;width:100%;font-family:inherit}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:64px;line-height:1.6}
input:focus,select:focus,textarea:focus{border-color:var(--sun);outline:none;box-shadow:0 0 0 3.5px var(--sun-soft)}
.inline{display:flex;gap:15px;flex-wrap:wrap}
.inline .field{max-width:190px}

/* ── 입력 시트 ──────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(48,36,16,.45);z-index:60;display:none}
.scrim.open{display:block}
.sheet{position:fixed;z-index:61;background:var(--bg);display:none;flex-direction:column}
.sheet.open{display:flex}
@media (min-width:761px){
  .sheet{top:34px;bottom:34px;left:50%;transform:translateX(-50%);width:min(760px,94vw);border-radius:20px;box-shadow:var(--shadow-2);overflow:hidden;border:1.5px solid var(--line)}
}
@media (max-width:760px){ .sheet{inset:0} }
.sheet-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1.5px solid var(--line);background:var(--surface)}
.sheet-hd h2{font-family:var(--f-display);font-size:18px;font-weight:400;margin:0;margin-right:auto}
.sheet-bd{overflow-y:auto;padding:18px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-ft{padding:12px 18px;border-top:1.5px solid var(--line);background:var(--surface);display:flex;gap:9px;align-items:center}
.sheet-ft .btn.primary{margin-left:auto}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:0 0 9px;width:100%;border-bottom:1.5px solid var(--line);margin-bottom:13px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.fgrid .full{grid-column:1/-1}
.unit{position:relative}
.unit .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--muted);pointer-events:none}
.unit input{padding-right:46px}
.rateGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px}
.rateItem{display:flex;align-items:center;gap:9px}
.rateItem .rl{font-size:13px;flex:1;min-width:0}
.rateItem .rw{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.stars{display:flex;gap:3px;flex:none}

  const d=new Date(v+'T00:00:00'); if(isNaN(d)) return esc(v);

}

/* ═══ 계산 ═══════════════════════════════════ */
function pyeong(p){ const a=nm(p.area); return a==null?null:a/PYEONG; }
function perPyeong(p){ const py=pyeong(p), pr=nm(p.price); return (py&&pr!=null)?pr/py:null; }
function monthly(p,s){
  const price=nm(p.price); if(price==null) return null;
  const loan=Math.max(0,Math.min(nm(p.loan)||0, price));
  const equity=price-loan;
  const lr=(nm(p.loanRate)!=null?nm(p.loanRate):(s.loanRate||0))/100;
  const er=(s.equityRate||0)/100;
  return loan*lr/12 + equity*er/12 + (nm(p.fee)||0);
}
/* 별점은 사람마다 따로 매깁니다. 예전 데이터(ratings 하나)는 장부 주인이 매긴 것으로 봅니다. */
function ratingMap(p){
  if(p.ratingsBy && typeof p.ratingsBy==='object') return p.ratingsBy;
  if(p.ratings && Object.keys(p.ratings).length && state.book) return {[state.book.owner]:p.ratings};
  return {};
}
function myRatings(p){ const who=store.user?store.user.email:'me'; return ratingMap(p)[who]||{}; }
function raters(p){ return Object.keys(ratingMap(p)).filter(k=>{
  const r=ratingMap(p)[k]; return r && Object.keys(r).some(x=>nm(r[x])>0); }); }
function scoreBy(p,s,who){
  let got=0,max=0; const r=(ratingMap(p)[who])||{};
  s.ratings.forEach(it=>{ const v=nm(r[it.key]); if(v>0){ got+=v*it.weight; max+=5*it.weight; } });
  return max?Math.round(got/max*100):null;
}
/* 여러 사람이 매겼으면 평균을 총점으로 씁니다. */
function score(p,s){
  const people=raters(p);
  if(people.length){
    const vals=people.map(w=>scoreBy(p,s,w)).filter(v=>v!=null);
    if(vals.length) return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
    return null;
  }
  let got=0,max=0; const r=p.ratings||{};
  s.ratings.forEach(it=>{ const v=nm(r[it.key]); if(v>0){ got+=v*it.weight; max+=5*it.weight; } });
  return max?Math.round(got/max*100):null;
}

function mergeSettings(raw){
  const out=Object.assign({},DEFAULT_SETTINGS,raw||{});
  out.budget=Object.assign({},DEFAULT_BUDGET,(raw&&raw.budget)||{});
  return out;
}

/* 사람마다 적은 돈. 예전에 한 칸에 적어둔 값은 장부 주인이 적은 것으로 봅니다. */
function budgetPeople(b){
  if(b.people && typeof b.people==='object') return b.people;
  const who = state.book ? state.book.owner : ((store.user||{}).email||'me');
  const out = {};
  Object.keys(b.incomes||{}).forEach(k=>{ out[k]={income:b.incomes[k]}; });
  out[who] = Object.assign({}, out[who]||{}, {
    cash:b.cash, invest:b.invest, subscription:b.subscription, etc:b.etcAsset,
    debt:b.debt, debtMonthly:b.debtMonthly
  });
  return out;
}
function budgetSum(b,f){
  const P=budgetPeople(b);
  return Object.keys(P).reduce((a,k)=>a+(nm(P[k][f])||0),0);
}
function personNet(b,p){
  const use=(nm(b.investUse)!=null?nm(b.investUse):80)/100;
  return (nm(p.cash)||0)+(nm(p.invest)||0)*use+(nm(p.subscription)||0)+(nm(p.etc)||0)-(nm(p.debt)||0);
}

/* ═══ 예산 ══════════════════════════════════
 * 직접 넣은 숫자로만 계산합니다. 실제 대출 한도와 세금은 은행과 세무서가 정합니다.
 * 금액 단위는 모두 만원입니다.
 */
function annuityPay(P, rate, years){          // 원금 → 월 원리금
  const r=rate/100/12, n=years*12;
  if(!(P>0)||!(n>0)) return 0;
  if(r<=0) return P/n;
  return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
}
function annuityPrincipal(M, rate, years){    // 월 원리금 → 빌릴 수 있는 원금
  const r=rate/100/12, n=years*12;
  if(!(M>0)||!(n>0)) return 0;
  if(r<=0) return M*n;
  return M*(Math.pow(1+r,n)-1)/(r*Math.pow(1+r,n));
}

function budgetPlan(s){
  const b=s.budget||DEFAULT_BUDGET, v=k=>nm(b[k])||0;
  const rate=nm(s.loanRate)||0, years=nm(b.years)||30;

  /* 모을 수 있는 내 돈 — 각자 적은 것을 합친다 */
  const sum = f => budgetSum(b,f);
  const investUsable = sum('invest')*(nm(b.investUse)!=null?nm(b.investUse):80)/100;
  const assets = sum('cash')+investUsable+sum('subscription')+sum('etc')+v('deposit')+v('support');
  const debt = sum('debt'), debtMonthly = sum('debtMonthly');
  const equity = Math.max(0, assets - debt - v('reserve'));

  /* 매달 낼 수 있는 돈 — 현금흐름과 DSR 중 작은 쪽 */
  const income = sum('income') + v('otherIncome');
  const flow = Math.max(0, income - v('living') - v('save') - debtMonthly);
  const dsrCap = Math.max(0, income*(nm(b.dsr)||40)/100 - debtMonthly);
  const capMonthly = Math.min(flow, dsrCap);
  const capBy = flow<=dsrCap ? 'flow' : 'dsr';

  /* 빌릴 수 있는 돈 */
  const byCash = annuityPrincipal(capMonthly, rate, years);
  const ltv=(nm(b.ltv)||70)/100, c=(nm(b.costRate)||0)/100;
  const denom = 1 + c - ltv;
  const byLtv = denom>0 ? ltv*equity/denom : Infinity;
  const loanMax = Math.max(0, Math.min(byCash, byLtv));
  const limitedBy = byCash<=byLtv ? (capBy==='dsr'?'dsr':'flow') : 'ltv';

  /* 매매 상한 — 집값에 부대비용이 비례해서 붙는다 */
  const salePrice = (equity + loanMax) / (1 + c);
  const saleMonthly = annuityPay(loanMax, rate, years);

  /* 전세 상한 — 보증금의 일정 비율까지만 빌린다 */
  const jRate = nm(b.jeonseRate)!=null ? nm(b.jeonseRate) : rate;
  const jLtv=(nm(b.jeonseLtv)||80)/100, jc=(nm(b.jeonseCostRate)||0)/100;
  const jByFlow = capMonthly>0 && jRate>0 ? capMonthly*12/(jRate/100) : (capMonthly>0?Infinity:0);
  const jDenom = 1 + jc - jLtv;
  const jByLtv = jDenom>0 ? jLtv*equity/jDenom : Infinity;
  const jCap = nm(b.jeonseMax)>0 ? nm(b.jeonseMax) : Infinity;
  const jLoan = Math.max(0, Math.min(jByFlow, jByLtv, jCap));
  const jeonseDeposit = (equity + jLoan) / (1 + jc);
  const jeonseMonthly = jLoan*(jRate/100)/12;

  const filled = assets>0 || income>0;
  return {equity, assets, debt, debtMonthly, income, flow, dsrCap, capMonthly, capBy,
          byCash, byLtv, loanMax, limitedBy, salePrice, saleMonthly,
          jLoan, jeonseDeposit, jeonseMonthly, jRate, rate, years, filled};
}

/* 매물 하나가 예산에 맞는지 */
function verdict(p, plan, s){
  if(!plan.filled) return null;
  const price=nm(p.price); if(price==null) return null;
  const b=s.budget||DEFAULT_BUDGET;
  const sale = p.dealType!=='jeonse';
  const c=(sale?(nm(b.costRate)||0):(nm(b.jeonseCostRate)||0))/100;
  const need = price*(1+c);
  const loan = need - plan.equity;

  if(loan<=0) return {k:'cash', l:'현금으로', m:(nm(p.fee)||0)};
  const cap = sale ? plan.loanMax : plan.jLoan;
  if(loan > cap*1.001) return {k:'over', l:'예산 밖', m:null, short:loan-cap};

  const pay = sale ? annuityPay(loan, plan.rate, plan.years) : loan*(plan.jRate/100)/12;
  const total = pay + (nm(p.fee)||0);
  if(plan.capMonthly>0 && total > plan.capMonthly) return {k:'over', l:'예산 밖', m:total};
  if(plan.capMonthly>0 && total > plan.capMonthly*0.85) return {k:'tight', l:'빠듯', m:total};
  return {k:'ok', l:'여유', m:total};
}

/* ═══ 상태 & 저장 ════════════════════════════ */
const LS_P='househunt.props.v1', LS_S='househunt.settings.v1', LS_X='househunt.samplesOff.v1';
const state = {
  props:{}, settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
  view:'table', sort:{key:'score',dir:'desc'}, picks:[], editing:null, draft:null, loading:true,
  book:null, books:[], members:[], admin:null, isAdmin:false,
  samplesOff: (function(){ try{return localStorage.getItem(LS_X)==='1';}catch(e){return false;} })(),
  cmpSame:false
};

const store = {
  mode:'local', db:null, assets:null, user:null, photosOk:false, photoStore:'', photoMax:0,

  loadLocal(){
    try{
      const p=JSON.parse(localStorage.getItem(LS_P)||'null'); if(p&&typeof p==='object') state.props=p;
      const s=JSON.parse(localStorage.getItem(LS_S)||'null'); if(s) state.settings=mergeSettings(s);
    }catch(e){}
  },
  saveLocal(){
    if(this.mode==='api') return;            // 계정별 서버 저장일 때는 브라우저에 남기지 않는다
    try{
      localStorage.setItem(LS_P,JSON.stringify(state.props));
      localStorage.setItem(LS_S,JSON.stringify(state.settings));
    }catch(e){ toast('브라우저 저장 공간이 가득 찼습니다'); }
  },
  clearLocal(){ try{ localStorage.removeItem(LS_P); localStorage.removeItem(LS_S); }catch(e){} },

  async connect(){
    /* 어떤 이유로든 오래 걸리면 장부를 먼저 보여준다 */
    const giveUp = setTimeout(()=>{ if(state.loading){ state.loading=false; render(); } }, 2500);
    const settled = ()=>{ clearTimeout(giveUp); state.loading=false; };

    /* 1순위 — 직접 올린 서버(Cloudflare Worker)에 붙는다 */
    try{
      const r=await fetch('/api/me',{credentials:'same-origin',headers:{accept:'application/json'}});
      if(r.status===401){
        let j=null; try{ j=await r.json(); }catch(e){}
        if(j&&j.login){ location.href=j.login; return; }   // 우리 서버가 맞을 때만 로그인으로 보낸다
      }
      if(r.ok && (r.headers.get('content-type')||'').indexOf('json')>=0){
        this.user=await r.json(); this.mode='api'; this.photosOk=!!this.user.photos;
        state.book=this.user.book||null; state.books=this.user.books||[];
        this.photoStore=this.user.photoStore||''; this.photoMax=this.user.photoMax||0;
        state.isAdmin=!!this.user.admin;
        const ab=$('#views button[data-view="admin"]'); if(ab) ab.hidden=!state.isAdmin;
        if(state.isAdmin) loadAdmin();
        this.clearLocal(); state.props={};
        try{ await this.pull(); }catch(e){ toast('내 매물을 불러오지 못했습니다'); }
        settled(); paintStorage(); render();
        window.addEventListener('focus',()=>{
          if(store.mode==='api' && !$('#sheet').classList.contains('open'))
            store.pull().then(render).catch(()=>{});
        });
        return;
      }
    }catch(e){ /* 자체 서버가 아니다 — 다음 방법으로 */ }

    /* 2순위 — Claude 아티팩트의 저장 기능 */
    settled(); render();
    let db=null, as=null;
    try{ if(window.claude&&typeof claude.use==='function') db=await claude.use('db'); }catch(e){ db=null; }
    if(db){
      this.db=db; this.mode='db';
      try{ await this.migrate(); }catch(e){}
      this.subscribe();
    }
    paintStorage();
    try{ if(window.claude&&typeof claude.use==='function') as=await claude.use('assets'); }catch(e){ as=null; }
    this.assets=as;
    render();
  },

  /* ── 자체 서버용 ── */
  async pull(){
    const r=await fetch('/api/state',{credentials:'same-origin'});
    if(!r.ok) throw new Error('불러오기 실패');
    const j=await r.json();
    const m={}; (j.properties||[]).forEach(p=>{ if(p&&p.id) m[p.id]=p; });
    state.props=m;
    if(j.settings) state.settings=mergeSettings(j.settings);
    if(j.book) state.book=j.book;
    if(j.members) state.members=j.members;
  },
  async call(method,path,body){
    const opt={method,credentials:'same-origin',headers:{}};
    if(body!==undefined){ opt.headers['content-type']='application/json'; opt.body=JSON.stringify(body); }
    const r=await fetch(path,opt);
    if(r.status===401){ location.href='/auth/login'; throw new Error('로그인이 풀렸습니다'); }
    if(!r.ok){ let m=''; try{ m=(await r.json()).error||''; }catch(e){} throw new Error(m||('HTTP '+r.status)); }
    return r.json();
  },

  /* ── 아티팩트용 ── */
  async migrate(){
    const snap=await this.db.collection('properties').limit(1).get();
    if(!snap.empty) return;
    const local=Object.values(state.props);
    if(!local.length) return;
    for(const p of local){ const b=Object.assign({},p); delete b.id; await this.db.doc('properties/'+p.id).set(b); }
    try{ await this.db.doc('config/settings').set(state.settings); }catch(e){}
    toast('이 기기에 있던 '+local.length+'곳을 서버로 옮겼습니다');
  },
  subscribe(){
    this.db.collection('properties').onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>{ m[d.id]=Object.assign({id:d.id},d.data()); });
      state.props=m; store.saveLocal();
      if(!$('#sheet').classList.contains('open')) render(); else renderChrome();
    }, err=>{ if(err&&err.code!=='revoked') console.warn('db',err); });
    this.db.doc('config/settings').onSnapshot(s=>{
      if(s.exists){ state.settings=mergeSettings(s.data()); store.saveLocal(); render(); }
    }, ()=>{});
  },

  /* ── 공통 쓰기 ── */
  async put(p){
    state.props[p.id]=p;
    if(!state.samplesOff){ state.samplesOff=true; try{ localStorage.setItem(LS_X,'1'); }catch(e){} }
    this.saveLocal(); render();
    const b=Object.assign({},p); delete b._sample;
    if(this.mode==='api'){
      try{ await this.call('PUT','/api/properties/'+encodeURIComponent(p.id), b); }
      catch(e){ toast('저장하지 못했습니다 — '+e.message); }
      return;
    }
    if(this.mode==='db'){
      delete b.id;
      try{ await this.db.doc('properties/'+p.id).set(b); }
      catch(e){ toast('서버 저장 실패 — 이 기기에는 남아 있습니다'); }
    }
  },
  async remove(id){
    delete state.props[id]; state.picks=state.picks.filter(x=>x!==id); this.saveLocal(); render();
    if(this.mode==='api'){
      try{ await this.call('DELETE','/api/properties/'+encodeURIComponent(id)); }
      catch(e){ toast('지우지 못했습니다 — '+e.message); }
      return;
    }
    if(this.mode==='db'){ try{ await this.db.doc('properties/'+id).delete(); }catch(e){ toast('서버에서 지우지 못했습니다'); } }
  },
  async putSettings(quiet){
    this.saveLocal(); if(!quiet) render();
    if(this.mode==='api'){ this.call('PUT','/api/settings',state.settings).catch(()=>{}); return; }
    if(this.mode==='db'){ try{ await this.db.doc('config/settings').set(state.settings); }catch(e){} }
  },
  putMany(list){
    list.forEach(p=>{ state.props[p.id]=p; });
    this.saveLocal(); render();
    const items=list.map(p=>{ const b=Object.assign({},p); delete b._sample; return b; });
    if(this.mode==='api'){ this.call('PUT','/api/properties',{items}).catch(()=>{}); return; }
    if(this.mode==='db'){
      items.forEach(b=>{ const id=b.id; delete b.id; this.db.doc('properties/'+id).set(b).catch(()=>{}); });
    }
  }
};

/* 화면에 보일 매물 — 실제 데이터가 없으면 예시를 보여준다 */
function usingSamples(){ return Object.keys(state.props).length===0 && !state.samplesOff; }
function allProps(){ return usingSamples() ? SAMPLES.slice() : Object.values(state.props); }

function ordered(){
  const s=state.settings, list=allProps(), key=state.sort.key, dir=state.sort.dir==='asc'?1:-1;
  if(key==='manual') return list.sort((a,b)=>(a.manualRank==null?9e9:a.manualRank)-(b.manualRank==null?9e9:b.manualRank));
  const val=p=>{
    switch(key){
      case 'score': return score(p,s);
      case 'budget': { const v=verdict(p,budgetPlan(s),s);
        return v?({cash:0,ok:1,tight:2,over:3})[v.k]:null; }
      case 'monthly': return monthly(p,s);
      case 'perPyeong': return perPyeong(p);
      case 'name': return p.name||'';
      case 'status': return STATUS.findIndex(x=>x.k===p.status);
      case 'moveIn': return p.moveIn||'';
      default: return nm(p[key])!=null?nm(p[key]):p[key]||'';
    }
  };
  return list.sort((a,b)=>{
    const x=val(a),y=val(b);
    const xn=(x==null||x===''), yn=(y==null||y==='');
    if(xn&&yn) return 0; if(xn) return 1; if(yn) return -1;
    if(typeof x==='string'||typeof y==='string') return String(x).localeCompare(String(y),'ko')*dir;
    return (x-y)*dir;
  });
}

/* ═══ 공통 조각 ══════════════════════════════ */
/* ═══ 일러스트 ══════════════════════════════
 * 아이소메트릭(30°) 시점에 얇은 외곽선, 평면 파스텔 채색.
 * 화면 좌표: sx=(x−y)·cos30, sy=(x+y)·sin30−z. x는 오른쪽 아래, y는 왼쪽 아래, z는 위.
 */
const ILL=(function(){
  const C={line:'var(--il-line)',wall:'var(--il-wall)',tan:'var(--il-tan)',leaf:'var(--il-leaf)',leaf2:'var(--il-leaf-2)',
    mint:'var(--il-mint)',sky:'var(--il-sky)',sky2:'var(--il-sky-2)',blue:'var(--il-blue)',pink:'var(--il-pink)',
    skin:'var(--il-skin)',yellow:'var(--il-yellow)',coral:'var(--il-coral)',grey:'var(--il-grey)',white:'var(--il-white)',
    snow:'var(--il-snow)',amber:'var(--il-amber)'};
  /* 테마: 'plain' 또는 'xmas'(눈 덮인 지붕, 흰 땅, 눈사람, 트리). 11월~1월은 xmas */
  let theme='plain';
  const X=()=>theme==='xmas';
  const G=()=>X()?C.snow:C.mint;
  const CX=0.8660254, CY=0.5;
  const r1=v=>Math.round(v*10)/10;
  const pt=(x,y,z)=>[r1((x-y)*CX), r1((x+y)*CY-(z||0))];
  const P=pts=>'M'+pts.map(p=>p[0]+' '+p[1]).join('L')+'Z';
  const poly=(pts,fill,extra)=>'<path d="'+P(pts)+'" fill="'+fill+'"'+(extra||'')+'/>';

  /* 상자 — 보이는 면은 왼쪽(y=d), 오른쪽(x=w), 윗면 */
  function box(x,y,z,w,d,h,c){
    c=c||{};
    return poly([pt(x,y+d,z),pt(x+w,y+d,z),pt(x+w,y+d,z+h),pt(x,y+d,z+h)], c.left||C.wall)
         + poly([pt(x+w,y,z),pt(x+w,y+d,z),pt(x+w,y+d,z+h),pt(x+w,y,z+h)], c.right||C.tan)
         + (c.top===false?'':poly([pt(x,y,z+h),pt(x+w,y,z+h),pt(x+w,y+d,z+h),pt(x,y+d,z+h)], c.top||C.wall));
  }
  /* 오른쪽 면(x 고정)에 붙는 창 */
  const winR=(x,y,z,w,h,fill)=>poly([pt(x,y,z),pt(x,y+w,z),pt(x,y+w,z+h),pt(x,y,z+h)], fill||C.sky2);
  /* 왼쪽 면(y 고정)에 붙는 창·문 */
  const winL=(x,y,z,w,h,fill)=>poly([pt(x,y,z),pt(x+w,y,z),pt(x+w,y,z+h),pt(x,y,z+h)], fill||C.sky2);

  /* 박공지붕 집. 용마루는 x축 방향. o는 처마 */
  function house(x,y,w,d,h,rh,c){
    c=c||{}; const o=c.o==null?3:c.o, roof=c.roof||C.leaf, roof2=c.roof2||C.leaf2;
    let s=box(x,y,0,w,d,h,{left:c.wall||C.wall,right:c.wall2||C.tan,top:false});
    /* 문 왼쪽 면, 창 오른쪽 면 */
    if(c.door!==false) s+=winL(x+w*0.6,y+d,0,w*0.22,h*0.62,c.doorFill||C.coral);
    if(c.win!==false){ s+=winR(x+w,y+d*0.18,h*0.38,d*0.26,h*0.3); s+=winR(x+w,y+d*0.58,h*0.38,d*0.26,h*0.3); }
    if(c.winL) s+=winL(x+w*0.15,y+d,h*0.4,w*0.25,h*0.28);
    /* 굴뚝은 뒤쪽 경사면에 */
    if(c.chimney) s+=box(x+w*0.7,y+d*0.18,h+rh*0.35,w*0.14,d*0.16,rh*0.75,{left:C.tan,right:C.grey,top:C.tan});
    /* 박공 → (완만할 때만 보이는) 뒤 경사 → 앞 경사 */
    s+=poly([pt(x+w,y,h),pt(x+w,y+d,h),pt(x+w,y+d/2,h+rh)], c.gable||c.wall2||C.tan);
    if(rh < (d/2+o)*CY) s+=poly([pt(x-o,y-o,h),pt(x+w+o,y-o,h),pt(x+w+o,y+d/2,h+rh),pt(x-o,y+d/2,h+rh)], roof2);
    s+=poly([pt(x-o,y+d+o,h),pt(x+w+o,y+d+o,h),pt(x+w+o,y+d/2,h+rh),pt(x-o,y+d/2,h+rh)], roof);
    if(X()){
      /* 지붕 위쪽 절반에 쌓인 눈, 굴뚝에서는 연기 */
      const f=0.52, ys=y+d/2+(d/2+o)*f, zs=h+rh-rh*f;
      s+=poly([pt(x-o,ys,zs),pt(x+w+o,ys,zs),pt(x+w+o,y+d/2,h+rh),pt(x-o,y+d/2,h+rh)], C.snow);
      if(c.chimney){
        const [cx,cy]=pt(x+w*0.77,y+d*0.26,h+rh*1.1);
        s+='<circle cx="'+r1(cx+1)+'" cy="'+r1(cy-4)+'" r="2.2" fill="'+C.white+'"/>'+
           '<circle cx="'+r1(cx+4)+'" cy="'+r1(cy-9.5)+'" r="3" fill="'+C.white+'"/>'+
           '<circle cx="'+r1(cx+8.5)+'" cy="'+r1(cy-16)+'" r="3.8" fill="'+C.white+'"/>';
      }
    }
    return s;
  }
  /* 평지붕 건물(빌라·아파트). 층마다 창 */
  function block(x,y,w,d,h,floors,c){
    c=c||{};
    let s=box(x,y,0,w,d,h,{left:c.wall||C.wall,right:c.wall2||C.tan,top:X()?C.snow:(c.top||C.sky2)});
    const fh=h/floors;
    for(let f=0;f<floors;f++){
      const z=fh*f+fh*0.28;
      for(let i=0;i<(c.nr||2);i++) s+=winR(x+w,y+d*(0.12+i*0.44),z,d*0.28,fh*0.42,C.sky2);
      for(let i=0;i<(c.nl||2);i++) s+=winL(x+w*(0.12+i*0.44),y+d,z,w*0.28,fh*0.42,f===0&&i===0&&c.door?C.coral:C.sky2);
    }
    /* 난간 */
    s+=box(x,y,h,w,d,c.rail||2.5,{left:C.tan,right:C.grey,top:X()?C.snow:C.tan});
    return s;
  }
  /* 둥근 나무 */
  function tree(x,y,r,c){

      '<circle cx="'+sx+'" cy="'+cy+'" r="'+r+'" fill="'+(c||C.leaf2)+'"/>'+
      (X()?'<path d="M'+r1(sx-r*0.86)+' '+r1(cy-r*0.5)+'a'+r+' '+r+' 0 0 1 '+r1(r*1.72)+' 0q-'+r1(r*0.86)+' '+r1(r*0.45)+' -'+r1(r*1.72)+' 0z" fill="'+C.snow+'"/>':'');

  /* 크리스마스 트리 — 전나무에 방울과 별 */
  function xmasTree(x,y,h){
    const [sx,sy]=pt(x,y,0); const th=h*0.16, tw=h*0.14, top=sy-th-h, w=h*0.5;
    let s='<path d="M'+(sx-tw/2)+' '+(sy-th)+'v'+th+'a'+(tw/2)+' '+(tw/4)+' 0 0 0 '+tw+' 0v-'+th+'z" fill="'+C.tan+'"/>'+
      pineShape(sx,top,h,C.leaf2);
    const cols=[C.coral,C.yellow,C.sky2,C.coral,C.yellow,C.sky2];
    for(let i=0;i<6;i++){
      const f=0.3+i*0.11, cx=sx+(i%2?1:-1)*w*(0.1+0.07*i)*0.9, cy=top+h*f;
      s+='<circle cx="'+r1(cx)+'" cy="'+r1(cy)+'" r="'+r1(h*0.045)+'" fill="'+cols[i]+'"/>';
    }

    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r:R; d+=(i?'L':'M')+r1(sx+Math.cos(a)*rr)+' '+r1(top-1+Math.sin(a)*rr); }

  /* 눈송이 — 화면 좌표 그대로 */

  /* 사람. 키 h. flip이면 왼쪽을 본다 */
  function person(x,y,h,c){

         '<circle cx="'+r1(mx)+'" cy="'+r1(my)+'" r="'+r1(u*1.5)+'" fill="'+C.sky2+'" fill-opacity=".85"/></g>';

  /* 동전 더미 */

  /* 아래쪽 마을 띠. 화면 가로 위치 sx와 깊이 dp를 아이소 좌표로 바꿔 한 줄로 늘어놓는다 */

      /* 뒤줄 */

      /* 앞줄 */

function arm(btn, ask, back){
  if(btn.dataset.armed==='1'){ btn.dataset.armed=''; return true; }
  btn.dataset.armed='1'; const was=btn.textContent; btn.textContent=ask;
  setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed=''; btn.textContent=back||was; } },4000);
  return false;
}

function renderCompare(){
  const byId={}; allProps().forEach(p=>byId[p.id]=p);
  const sel=state.picks.map(id=>byId[id]).filter(Boolean);
  if(sel.length<2){
    return '<div class="empty"><div class="pic" aria-hidden="true">'+ILL.compare()+'</div>'+
      '<h3>나란히 놓고 볼 집을 골라 주세요</h3>'+
      '<p>표나 카드 화면에서 체크박스로 2~3곳을 선택하면 항목별로 나란히 놓고 봅니다.</p>'+
      '<button class="btn primary" data-go="table">표로 가기</button></div>';
  }
  const rows=cmpRows();
  const body=rows.map(r=>{
    if(r.sect) return '<tr class="sect"><td class="lbl" style="background:var(--surface-3)">'+r.sect+'</td><td colspan="'+sel.length+'"></td></tr>';
    const cells=sel.map(p=>r.txt(p));
    if(state.cmpSame && !r.long){
      const uniq=cells.filter((c,i)=>cells.indexOf(c)===i);
      if(uniq.length===1) return '';
    }
    let cls=sel.map(()=>'');
    if(r.v){
      const vals=sel.map(r.v);
      const ok=vals.filter(v=>v!=null&&isFinite(v));
      if(ok.length>1){
        const best=r.low?Math.min.apply(null,ok):Math.max.apply(null,ok);
        const worst=r.low?Math.max.apply(null,ok):Math.min.apply(null,ok);
        if(best!==worst) cls=vals.map(v=>v==null?'':(v===best?' class="best"':(v===worst?' class="worst"':'')));
      }
    }
    return '<tr><td class="lbl">'+r.l+'</td>'+
      cells.map((c,i)=>'<td'+(cls[i]||(r.long?' class="long"':''))+'>'+

/* 사람마다 자기 돈을 적는 판. 혼자면 이름 없이 한 덩어리로 보인다. */
function peoplePanel(people, plan){
  const b=state.settings.budget, alone=people.length<2;
  const won=v=>fmtMan(Math.max(0,Math.round(v)));
  const P=budgetPeople(b);

  const blocks = people.map((m,i)=>{
    const mine=P[m.email]||{};
    const net=personNet(b,mine);
    const head = alone ? '' :
      '<div class="pblock-hd"><span class="ava">'+esc((m.name||m.email).slice(0,1))+'</span>'+
      '<span class="pnm">'+esc(m.name||m.email.split('@')[0])+
        (m.email===(store.user||{}).email?' <b>(나)</b>':'')+'</span>'+
      '<span class="pnet" data-net="'+esc(m.email)+'">'+(net?won(net):'—')+'</span></div>';
    return '<div class="pblock'+(alone?' alone':'')+'">'+head+
      '<div class="fgrid">'+PERSON_FIELDS.map(f=>pfield(m.email,i,f)).join('')+'</div></div>';
  }).join('');

  const others = people.filter(m=>!P[m.email] || !Object.keys(P[m.email]).length);
  const waiting = !alone && others.length && others.length<people.length
    ? '<p class="byline">'+esc(others.map(m=>m.name||m.email.split('@')[0]).join(', '))+
      ' 님은 아직 안 적었습니다.</p>' : '';

  return '<div class="panel"><h2>'+(alone?'내 예산':'각자 가진 돈')+'</h2>'+
    '<p class="desc">'+(alone
      ? '집에 넣을 수 있는 돈만 적으세요. 단위는 만원입니다. 5,000만원이면 5000, 3억이면 30000입니다.'
      : '각자 자기 것만 적으면 자동으로 합쳐집니다. 서로 덮어쓰지 않습니다. 단위는 만원이라 3억이면 30000입니다.')+'</p>'+
    blocks + waiting +
    (alone?'':'<div class="psum" id="psumLine">합쳐서 <b>'+won(plan.assets-( nm(b.deposit)||0)-(nm(b.support)||0))+
      '</b>'+(plan.debt?' · 갚을 빚 '+won(plan.debt):'')+'</div>')+
    '</div>';
}

function paintBudget(){
  const plan=budgetPlan(state.settings), b=state.settings.budget;
  const top=$('#budgetTop'); if(top) top.innerHTML=budgetTopHTML(plan);
  const P=budgetPeople(b);
  $$('[data-net]').forEach(el=>{
    const net=personNet(b, P[el.dataset.net]||{});
    el.textContent = net?fmtMan(Math.max(0,Math.round(net))):'—';
  });
  const sum=$('#psumLine');
  if(sum) sum.innerHTML='합쳐서 <b>'+fmtMan(Math.max(0,Math.round(
      plan.assets-(nm(b.deposit)||0)-(nm(b.support)||0))))+'</b>'+
      (plan.debt?' · 갚을 빚 '+fmtMan(Math.round(plan.debt)):'');
}

function openSheet(id){
  const src = id ? (allProps().find(p=>p.id===id)||null) : null;
  state.editing = id||null;
  state.draft = src ? JSON.parse(JSON.stringify(src)) : {id:uid(), status:'interest', dealType:'jeonse', ratings:{}, photos:[]};
  if(!state.draft.ratingsBy || typeof state.draft.ratingsBy!=='object'){
    state.draft.ratingsBy = src ? Object.assign({}, ratingMap(src)) : {};
  }
  delete state.draft.ratings;
  const who = store.user?store.user.email:'me';
  if(!state.draft.ratingsBy[who]) state.draft.ratingsBy[who]={};
  state.draft.ratings = state.draft.ratingsBy[who];   // 별점 버튼이 이 객체를 고칩니다
  if(!state.draft.photos) state.draft.photos=[];
  $('#sheetTitle').textContent = src ? '매물 수정' : '매물 추가';
  $('#sheetDelete').style.display = src ? '' : 'none';
  $('#sheetBody').innerHTML = formHTML(state.draft);
  $('#sheetBody').scrollTop = 0;
  $('#scrim').classList.add('open'); $('#sheet').classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>{ const f=$('#sheetBody input[name=name]'); if(f) f.focus(); },30);
}
function closeSheet(){
  $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open');
  document.body.style.overflow=''; state.editing=null; state.draft=null;
}
function formHTML(d){

    g.f.map(f=>field(f,d)).join('')+'</div></fieldset>').join('');
  const me = store.user?store.user.email:'me';
  const others = Object.keys(d.ratingsBy||{}).filter(k=>k!==me&&Object.keys(d.ratingsBy[k]||{}).length);
  const rate='<fieldset><legend>별점'+(state.members.length>1?' — 내가 매기는 점수':'')+'</legend><div class="rateGrid">'+
    state.settings.ratings.map(it=>{
      const v=nm((d.ratings||{})[it.key])||0;
      const side=others.map(k=>{ const ov=nm((d.ratingsBy[k]||{})[it.key])||0;
        return ov?'<span class="mate" title="'+esc(nameOf(k))+'">'+esc(nameOf(k).slice(0,1))+' '+ov+'</span>':''; }).join('');
      return '<div class="rateItem"><span class="rl">'+esc(it.label)+' <span class="rw">×'+it.weight+'</span>'+side+'</span>'+
        '<span class="stars" role="group" aria-label="'+esc(it.label)+' 별점">'+
        [1,2,3,4,5].map(n=>'<button type="button" class="'+(n<=v?'on':'')+'" data-star="'+it.key+'" data-n="'+n+'" aria-label="'+n+'점">'+STAR+'</button>').join('')+
        '</span></div>';
    }).join('')+'</div></fieldset>';
  const canPhoto = !!store.assets || store.mode==='local' || (store.mode==='api' && store.photosOk);
  const shots=(d.photos||[]).map((ph,i)=>'<figure><img src="'+photoSrc(ph)+'" alt="매물 사진 '+(i+1)+'"><button type="button" class="rm" data-rmphoto="'+i+'" aria-label="사진 삭제">✕</button></figure>').join('');
  const photo='<fieldset><legend>사진</legend>'+
    (canPhoto
      ? '<div class="photoRow" id="photoRow">'+shots+'<button type="button" class="addPhoto" id="pickPhoto">＋ 사진</button></div>'+
        '<input type="file" id="photoInput" accept="image/*" multiple hidden>'
      : '<p class="desc" style="margin:0">이 화면에서는 사진을 올릴 수 없습니다. 올려둔 주소에서 열면 사용할 수 있습니다.</p>')+
    (canPhoto && store.mode==='api' && store.photoStore==='db'
      ? '<p class="byline" style="margin-top:8px">사진은 장부에 함께 담깁니다. 한 장부에 300장까지 올릴 수 있습니다.</p>' : '')+
    '</fieldset>';
  return groups+rate+photo;
}
function field(f,d){
  const v = d[f.k]==null?'':d[f.k];
  const cls = f.full?' class="field full"':' class="field"';
  const id = 'f_'+f.k;
  let ctrl;
  if(f.t==='select'){
    const opts=(f.opts||[]).map(o=>'<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>').join('');
    ctrl='<select id="'+id+'" name="'+f.k+'">'+opts+'</select>';
  } else if(f.t==='area'){
    ctrl='<textarea id="'+id+'" name="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
  } else {
    const type = f.t==='num'?'number':(f.t==='date'?'date':(f.t==='url'?'url':(f.t==='tel'?'tel':'text')));
    const step = f.t==='num'?' step="any"':'';
    const inp='<input type="'+type+'" id="'+id+'" name="'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"'+step+'>';
    ctrl = f.u ? '<div class="unit">'+inp+'<span class="u">'+f.u+'</span></div>' : inp;
  }
  return '<div'+cls+'><label for="'+id+'">'+f.l+'</label>'+ctrl+'</div>';
}
function collectForm(){
  const d=state.draft;
  $$('#sheetBody [name]').forEach(el=>{
    const k=el.name, raw=el.value.trim();
    if(el.type==='number'){ d[k] = raw===''?null:Number(raw); }
    else d[k] = raw===''?'':raw;
  });
  return d;
}

function setView(v){ state.view=v; render(); $('#scroller').scrollTo({top:0,behavior:'instant'}); }
function setSort(k){
  if(state.sort.key===k) state.sort.dir = state.sort.dir==='asc'?'desc':'asc';
  else state.sort={key:k, dir:(k==='name'||k==='moveIn'||k==='status')?'asc':(k==='score'?'desc':'asc')};
  render();
}
function togglePick(id,on){
  const i=state.picks.indexOf(id);
  if(on&&i<0){ if(state.picks.length>=3){ toast('나란히 비교는 3곳까지 됩니다'); render(); return; } state.picks.push(id); }
  else if(!on&&i>=0) state.picks.splice(i,1);
  render();
}
function move(id,dir){
  if(state.sort.key!=='manual'){ state.sort={key:'manual',dir:'asc'}; }
  const list=ordered();
  const i=list.findIndex(p=>p.id===id), j=dir==='up'?i-1:i+1;
  if(i<0||j<0||j>=list.length) return;
  const t=list[i]; list[i]=list[j]; list[j]=t;
  list.forEach((p,k)=>{ p.manualRank=k; });
  if(usingSamples()){ render(); return; }
  store.putMany(list.map(p=>Object.assign({},p)));
}
function saveSheet(){
  const editing=state.editing, d=collectForm();
  if(!d.name){ toast('이름은 채워 주세요'); const f=$('#sheetBody input[name=name]'); if(f) f.focus(); return; }
  delete d._sample;
  const who = store.user?store.user.email:'me';
  if(d.ratingsBy && d.ratings) d.ratingsBy[who]=d.ratings;
  delete d.ratings;
  if(d.ratingsBy) Object.keys(d.ratingsBy).forEach(k=>{
    const r=d.ratingsBy[k];
    if(!r || !Object.keys(r).some(x=>nm(r[x])>0)) delete d.ratingsBy[k];
  });
  if(d.manualRank==null) d.manualRank=Object.keys(state.props).length;
  store.put(d); closeSheet();
  toast(editing?'저장했습니다':'추가했습니다');
}

/* 사진 */
function resizeImage(file,max,quality){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('변환 실패')),'image/jpeg',quality||0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('읽기 실패')); };
    img.src=url;
  });
}
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
async function handleFiles(files){
  for(let i=0;i<files.length;i++){
    try{
      const wide = store.mode==='api' ? (store.photoStore==='r2'?1600:1280)
                 : (store.assets?1600:900);
      let blob=await resizeImage(files[i], wide);
      /* 서버가 받을 수 있는 크기를 넘으면 화질을 낮춰 다시 줄인다 */
      if(store.mode==='api' && store.photoMax){
        let q=0.72;
        while(blob.size>store.photoMax && q>=0.45){
          blob=await resizeImage(files[i], Math.round(wide*0.8), q); q-=0.12;
        }
        if(blob.size>store.photoMax){ toast('사진이 너무 큽니다'); continue; }
      }
      let ph;
      if(store.mode==='api'){
        const r=await fetch('/api/photos',{method:'POST',credentials:'same-origin',
          headers:{'content-type':'image/jpeg'},body:blob});
        if(!r.ok){ let m=''; try{ m=(await r.json()).error||''; }catch(e2){} throw new Error(m||'업로드 실패'); }
        const j=await r.json(); ph={url:j.url};
      }
      else if(store.assets){ const r=await store.assets.upload(blob); ph={id:r.id}; }
      else if(store.mode==='local'){ ph={url:await blobToDataURL(blob)}; }
      else { toast('사진 저장을 쓸 수 없습니다'); return; }
      state.draft.photos.push(ph); refreshPhotos();
    }catch(e){ toast('사진을 올리지 못했습니다'); }
  }
}
function refreshPhotos(){
  const row=$('#photoRow'); if(!row) return;
  row.innerHTML = state.draft.photos.map((ph,i)=>
    '<figure><img src="'+photoSrc(ph)+'" alt="매물 사진 '+(i+1)+'"><button type="button" class="rm" data-rmphoto="'+i+'" aria-label="사진 삭제">✕</button></figure>').join('')+
    '<button type="button" class="addPhoto" id="pickPhoto">＋ 사진</button>';
}

/* ═══ 이벤트 ════════════════════════════════ */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-view],[data-sort],[data-order],[data-edit],[data-move],[data-zoom],[data-go],[data-star],[data-rweight],[data-rdel],[data-rmphoto],[data-logout],[data-add],[data-kick],[data-unlock],[data-forcelogout],[data-deluser],[data-delbook],button');
  if(!t) return;

  if(t.dataset.view){ setView(t.dataset.view); return; }
  if(t.dataset.go){ setView(t.dataset.go); return; }
  if(t.dataset.sort){ setSort(t.dataset.sort); return; }
  if(t.dataset.order){ state.sort = t.dataset.order==='manual'?{key:'manual',dir:'asc'}:{key:'score',dir:'desc'}; render(); return; }
  if(t.dataset.move){ move(t.dataset.id,t.dataset.move); return; }
  if(t.dataset.edit){ openSheet(t.dataset.edit); return; }
  if(t.dataset.add){ openSheet(null); return; }
  if(t.dataset.unlock){
    store.call('POST','/api/admin/unlock',{email:t.dataset.unlock})
      .then(()=>{ toast('잠금을 풀었습니다'); return loadAdmin(); }).catch(e=>toast(e.message));
    return;
  }
  if(t.dataset.forcelogout){
    if(!arm(t,'모든 기기에서 나가게 할까요?','로그아웃')) return;
    store.call('POST','/api/admin/logout',{email:t.dataset.forcelogout})
      .then(()=>{ toast('그 회원의 로그인을 모두 끊었습니다'); return loadAdmin(); }).catch(e=>toast(e.message));
    return;
  }
  if(t.dataset.deluser){
    if(!arm(t,'계정과 그가 만든 장부까지 지울까요?','삭제')) return;
    store.call('DELETE','/api/admin/users/'+encodeURIComponent(t.dataset.deluser))
      .then(j=>{ toast('계정을 지웠습니다'+(j.droppedBooks?' · 장부 '+j.droppedBooks+'개 포함':'')); return loadAdmin(); })
      .catch(e=>toast(e.message));
    return;
  }
  if(t.dataset.delbook){
    if(!arm(t,'"'+(t.dataset.bookname||'')+'"를 통째로 지울까요?','삭제')) return;
    store.call('DELETE','/api/admin/books/'+encodeURIComponent(t.dataset.delbook))
      .then(()=>{ toast('장부를 지웠습니다'); return loadAdmin(); }).catch(e=>toast(e.message));
    return;
  }
  if(t.dataset.kick){
    if(!arm(t,'정말 내보낼까요?','내보내기')) return;
    store.call('DELETE','/api/members/'+encodeURIComponent(t.dataset.kick))
      .then(()=>store.pull()).then(()=>{ toast('내보냈습니다'); render(); })
      .catch(e=>toast(e.message));
    return;
  }
  if(t.dataset.zoom){ $('#lightboxImg').src=t.dataset.zoom; $('#lightbox').classList.add('open'); return; }
  if(t.dataset.logout){
    t.disabled=true;
    fetch('/auth/logout',{method:'POST',credentials:'same-origin'})
      .then(()=>{ location.href='/auth/login'; })
      .catch(()=>{ location.href='/auth/login'; });
    return;
  }

  if(t.dataset.star){
    const k=t.dataset.star, n=Number(t.dataset.n);
    const cur=nm(state.draft.ratings[k])||0;
    state.draft.ratings[k] = cur===n?0:n;
    const grp=t.parentNode;
    $$('button',grp).forEach((b,i)=>b.classList.toggle('on', i < (state.draft.ratings[k]||0)));
    return;
  }
  if(t.dataset.rweight!=null){
    state.settings.ratings[Number(t.dataset.rweight)].weight=Number(t.dataset.w);
    store.putSettings(); return;
  }
  if(t.dataset.rdel!=null){
    state.settings.ratings.splice(Number(t.dataset.rdel),1);
    store.putSettings(); return;
  }
  if(t.dataset.rmphoto!=null){ state.draft.photos.splice(Number(t.dataset.rmphoto),1); refreshPhotos(); return; }

  switch(t.id){
    case 'addBtn': openSheet(null); break;
    case 'sheetClose': closeSheet(); break;
    case 'sheetSave': saveSheet(); break;
    case 'sheetDelete': {
      if(t.dataset.armed!=='1'){ t.dataset.armed='1'; t.textContent='정말 지울까요?'; t.classList.add('danger');
        setTimeout(()=>{ if(t.dataset.armed==='1'){ t.dataset.armed=''; t.textContent='삭제'; } },4000); break; }
      const id=state.editing; t.dataset.armed=''; t.textContent='삭제';
      if(id && !usingSamples()){ store.remove(id); toast('지웠습니다'); }
      closeSheet(); break;
    }
    case 'goCompare': setView('compare'); break;
    case 'dumpJson': {
      t.disabled=true; t.textContent='모으는 중…';
      store.call('GET','/api/admin/export').then(j=>{
        const blob=new Blob([JSON.stringify(j,null,2)],{type:'application/json'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='하우스헌팅-'+new Date().toISOString().slice(0,10)+'.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(a.href),1000);
        toast('내려받았습니다');
      }).catch(e=>toast(e.message)).then(()=>{ t.disabled=false; t.textContent='데이터 내려받기'; });
      break;
    }
    case 'makeInvite': {
      t.disabled=true; t.textContent='만드는 중…';
      store.call('POST','/api/book/invite',{}).then(j=>{
        $('#inviteBox').innerHTML =
          '<p class="desc" style="margin:0 0 4px">아래 링크를 같이 쓸 사람에게 보내세요. '+j.days+'일 안에 한 번만 쓸 수 있습니다.</p>'+
          '<div class="inviteOut"><input type="text" id="inviteUrl" readonly value="'+esc(j.url)+'">'+
          '<button class="btn sm primary" id="copyInvite">복사</button>'+
          '<button class="btn sm ghost" id="killInvite">링크 끄기</button></div>';
        const f=$('#inviteUrl'); if(f){ f.focus(); f.select(); }
      }).catch(e=>{ toast(e.message); t.disabled=false; t.textContent='초대 링크 만들기'; });
      break;
    }
    case 'copyInvite': {
      const f=$('#inviteUrl');
      if(f && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(f.value).then(()=>toast('초대 링크를 복사했습니다')).catch(()=>toast('복사가 막혀 있습니다'));
      } else if(f){ f.select(); toast('길게 눌러 복사해 주세요'); }
      break;
    }
    case 'killInvite':
      store.call('DELETE','/api/book/invite').then(()=>{ toast('초대 링크를 껐습니다'); render(); }).catch(e=>toast(e.message));
      break;
    case 'leaveBook': {
      if(!arm(t,'정말 나갈까요?','이 장부에서 나가기')) break;
      store.call('POST','/api/book/leave',{}).then(()=>location.reload()).catch(e=>toast(e.message));
      break;
    }
    case 'clearPicks': state.picks=[]; render(); break;
    case 'addRating':
      state.settings.ratings.push({key:'r'+Date.now().toString(36), label:'새 항목', weight:2});
      store.putSettings(); break;
    case 'showSamples': state.samplesOff=false; try{localStorage.removeItem(LS_X);}catch(err){} render(); break;
    case 'pickPhoto': $('#photoInput').click(); break;
    case 'copyJson': {
      const txt=JSON.stringify({properties:allProps(), settings:state.settings}, null, 2);
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>toast('전체 내용을 클립보드에 복사했습니다')).catch(()=>toast('복사가 막혀 있습니다'));
      } else toast('이 브라우저에서는 복사를 쓸 수 없습니다');
      break;
    }
  }
});

document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset && t.dataset.pick){ togglePick(t.dataset.pick, t.checked); return; }
  if(t.id==='cmpSame'){ state.cmpSame=t.checked; render(); return; }
  if(t.dataset && t.dataset.booksel){
    store.call('POST','/api/book/switch',{bookId:t.value})
      .then(()=>location.reload()).catch(e=>toast(e.message));
    return;
  }
  if(t.id==='bookName'){
    const name=t.value.trim(); if(!name) return;
    store.call('POST','/api/book/rename',{name})
      .then(()=>{ state.book.name=name;
        const b=state.books.find(x=>x.id===state.book.id); if(b) b.name=name;
        toast('장부 이름을 바꿨습니다'); render(); })
      .catch(e=>toast(e.message));
    return;
  }
  if(t.dataset && t.dataset.bk){
    const raw=t.value.trim();
    state.settings.budget[t.dataset.bk] = raw===''?null:Number(raw);
    store.putSettings(true); paintBudget(); return;
  }
  if(t.dataset && t.dataset.pk){
    const b=state.settings.budget;
    if(!b.people) b.people = JSON.parse(JSON.stringify(budgetPeople(b)));   // 예전 모양을 먼저 옮긴다
    const em=t.dataset.pemail;
    if(!b.people[em]) b.people[em]={};
    const raw=t.value.trim();
    if(raw==='') delete b.people[em][t.dataset.pk];
    else b.people[em][t.dataset.pk]=Number(raw);
    ['cash','invest','subscription','etcAsset','debt','debtMonthly','incomes'].forEach(k=>delete b[k]);
    store.putSettings(true); paintBudget(); return;
  }
  if(t.dataset && t.dataset.income){
    const raw=t.value.trim();
    if(!state.settings.budget.incomes) state.settings.budget.incomes={};
    if(raw==='') delete state.settings.budget.incomes[t.dataset.income];
    else state.settings.budget.incomes[t.dataset.income]=Number(raw);
    store.putSettings(); return;
  }
  if(t.id==='loanRate'){ state.settings.loanRate=Number(t.value)||0; store.putSettings(); return; }
  if(t.id==='equityRate'){ state.settings.equityRate=Number(t.value)||0; store.putSettings(); return; }
  if(t.dataset && t.dataset.rlabel!=null){
    state.settings.ratings[Number(t.dataset.rlabel)].label = t.value.trim()||'이름 없는 항목';
    store.putSettings(); return;
  }
  if(t.id==='photoInput' && t.files && t.files.length){ handleFiles(Array.prototype.slice.call(t.files)); t.value=''; return; }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if($('#lightbox').classList.contains('open')) $('#lightbox').classList.remove('open');
    else if($('#sheet').classList.contains('open')) closeSheet();
  }
  if((e.key==='Enter'||e.key===' ') && e.target.dataset && e.target.dataset.edit && e.target.getAttribute('role')==='button'){
    e.preventDefault(); openSheet(e.target.dataset.edit);
  }
});
$('#scrim').addEventListener('click', closeSheet);
$('#lightbox').addEventListener('click', function(){ this.classList.remove('open'); });

/* ═══ 시작 ══════════════════════════════════ */
$('#town').innerHTML=ILL.town();
store.loadLocal();
paintStorage();
render();
store.connect();
})();
</script>
